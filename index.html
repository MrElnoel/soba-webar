<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meet Soba</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#hint{position:fixed;z-index:100;top:calc(env(safe-area-inset-top) + 18px);left:22px;right:22px;padding:15px 18px;border-radius:18px;background:rgba(0,0,0,.78);color:#fff;font:750 17px system-ui,-apple-system,sans-serif;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="hint">Find Soba!</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes; uiLoading: yes; uiError: yes"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="3000">
    <video id="sobaVideo" src="./soba.mp4" preload="auto" muted loop playsinline webkit-playsinline></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- TEST: solid red box over the poster. Delete once Soba shows. -->
    <a-plane position="0 0 0" width="1" height="1.5457" color="#ff3b30" opacity="0.5"></a-plane>
    <a-video src="#sobaVideo" position="0 0 0.01" width="1" height="1.5457"></a-video>
  </a-entity>
</a-scene>

<script>
const target=document.getElementById('target');
const video=document.getElementById('sobaVideo');
const hint=document.getElementById('hint');
let found=false;
target.addEventListener('targetFound',()=>{found=true;hint.textContent='Soba is here!';video.play().catch(()=>{hint.textContent='Tap to play Soba'})});
target.addEventListener('targetLost',()=>{found=false;video.pause();hint.textContent='Find Soba!'});
document.addEventListener('touchend',()=>{if(found&&video.paused){video.play();hint.textContent='Soba is here!'}},{passive:true});
</script>
</body>
</html>
